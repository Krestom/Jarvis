# Jarvis — изолированный compose-проект: своя сеть, свои volumes,
# собственный префикс имён сервисов. Не конфликтует с другими приложениями.
name: jarvis

services:
  postgres:
    image: postgres:17-alpine
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    # Наружу не торчит: порт только на loopback (для отладки через ssh-туннель).
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis} -d ${POSTGRES_DB:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jarvis-net

  app:
    build: .
    image: jarvis-app:local
    container_name: jarvis-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-jarvis}
      DOCUMENT_STORAGE_PATH: /data/documents
      HEALTH_HOST: 0.0.0.0
    volumes:
      - jarvis-files:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - jarvis-net

  mcp:
    build: .
    image: jarvis-app:local
    container_name: jarvis-mcp
    restart: unless-stopped
    command: ["python", "-m", "jarvis.mcp"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jarvis}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-jarvis}
      SKIP_MIGRATIONS: "1"
      MCP_HOST: 0.0.0.0
    # Доступ только через ssh-туннель: порт слушает loopback хоста.
    ports:
      - "127.0.0.1:${MCP_PORT:-8765}:${MCP_PORT:-8765}"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket,sys; s=socket.socket(); s.settimeout(5); sys.exit(0 if s.connect_ex(('127.0.0.1', 8765)) == 0 else 1)",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - jarvis-net

volumes:
  jarvis-pgdata:
  jarvis-files:

networks:
  jarvis-net:
    driver: bridge
